<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- CAT API favicon：侧脸猫剪影 + 工程感 -->
  <rect width="32" height="32" rx="7" fill="#faf9f7"/>
  <!-- 耳朵 -->
  <path d="M 7 9 L 9 4 L 12 8 Z" fill="#1a1a1a"/>
  <path d="M 13 7 L 16 3 L 17 9 Z" fill="#1a1a1a"/>
  <!-- 头 -->
  <path d="M 6 10 Q 4 18 8 22 Q 14 24 18 22 Q 22 18 20 12 Q 16 7 11 8 Q 7 8 6 10 Z" fill="#1a1a1a"/>
  <!-- 眼睛：两只圆点 -->
  <circle cx="10" cy="14" r="1.3" fill="#faf9f7"/>
  <circle cx="16" cy="13" r="1.3" fill="#faf9f7"/>
  <!-- 胡须：两道短横线（工程感） -->
  <line x1="3" y1="18" x2="6" y2="18" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="3" y1="20" x2="6" y2="20" stroke="#1a1a1a" stroke-width="0.7" stroke-linecap="round"/>
  <!-- accent 角标：右下角小方块（致敬 API spec 的角标感） -->
  <rect x="24" y="24" width="5" height="5" rx="1" fill="#4b5563"/>
</svg>
