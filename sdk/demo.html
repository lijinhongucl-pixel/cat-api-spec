<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<title>SDK 控制台 — CAT API</title>
<link rel="stylesheet" href="../assets/css/spec.css">
<style>
  .swrap { max-width: 1100px; margin: 0 auto; padding: 28px; }
  .doc-tag { display: inline-block; padding: 3px 10px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent-deep); font-size: 12px;
    letter-spacing: 0.06em; font-weight: 600; }
  h1 { font-size: 26px; margin: 14px 0 8px; }
  .lead { color: var(--muted); font-size: 15px; margin-bottom: 28px; max-width: 740px; }
  .scols { display: grid; grid-template-columns: 360px 1fr; gap: 28px; }
  @media (max-width: 820px) { .scols { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .panel h3 { font-size: 15px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ep { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px;
    cursor: pointer; transition: all .15s; font-size: 14px; }
  .ep:hover { border-color: var(--accent); background: var(--accent-soft); }
  .ep .m { font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 3px; min-width: 50px; text-align: center; }
  .ep .m.get { background: #dbeafe; color: #1e40af; }
  .ep .m.post { background: #dcfce7; color: #166534; }
  .ep .m.delete { background: #fee2e2; color: #991b1b; }
  .ep .m.patch { background: #fef3c7; color: #92400e; }
  .ep .p { font-family: "SF Mono", "Menlo", monospace; font-size: 13px; color: var(--ink); flex: 1; }
  .ep .d { font-size: 12px; color: var(--faint); }
  .out-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; min-height: 400px; }
  pre.resp { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; font-size: 13px; line-height: 1.7; overflow-x: auto;
    font-family: "SF Mono", "Menlo", monospace; white-space: pre-wrap; word-break: break-all; }
  .status-tag { display: inline-block; padding: 2px 10px; border-radius: 4px;
    font-size: 12px; font-weight: 700; margin-right: 8px; }
  .status-2xx { background: #dcfce7; color: #166534; }
  .status-3xx { background: #dbeafe; color: #1e40af; }
  .status-4xx { background: #fef3c7; color: #92400e; }
  .status-5xx { background: #fee2e2; color: #991b1b; }
  .instance-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; }
  .instance-bar input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; flex: 1; }
  .clear-btn { padding: 6px 12px; background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; font-size: 12px; cursor: pointer; }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<script src="cat-api-client.js"></script>

    </div>

</div>

<div class="swrap">
  <span class="doc-tag">SDK / LIVE CONSOLE</span>
  <h1>SDK 控制台</h1>
  <p class="lead">
    点击任一接口，观察它返回什么。纯本地模拟——不发起网络请求，不收集任何数据，也不会真的去铲屎。
  </p>

  <div class="instance-bar">
    <span style="color:var(--muted);">实例命名：</span>
    <input id="instance-name" type="text" value="某只猫">
    <button class="clear-btn" onclick="clearOut()">清空输出</button>
  </div>

  <div class="scols">
    <!-- 左侧：接口列表 -->
    <div class="panel">
      <h3>CAT API</h3>
      <div id="ep-list"></div>
    </div>

    <!-- 右侧：响应 -->
    <div class="out-panel">
      <h3 style="margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--line);">响应</h3>
      <pre class="resp" id="resp-out">// 等待调用。提示：可以试试连点两次 POST /api/bath。</pre>
    </div>
  </div>
</div>

<script>
(function () {
  var list = document.getElementById("ep-list");
  var out = document.getElementById("resp-out");
  var client = window.CatAPIClient;

  list.innerHTML = client.RESOURCES.map(function (r, i) {
    var m = r.method.toLowerCase();
    return '<div class="ep" data-idx="' + i + '">' +
      '<span class="m ' + m + '">' + r.method + '</span>' +
      '<span class="p">' + r.path + '</span>' +
      '<span class="d">' + r.desc + '</span>' +
      '</div>';
  }).join("");

  list.querySelectorAll(".ep").forEach(function (el) {
    el.addEventListener("click", function () {
      var idx = +this.getAttribute("data-idx");
      var r = client.RESOURCES[idx];
      var name = document.getElementById("instance-name").value || "某只猫";
      appendLog("→ " + r.method + " " + r.path);
      appendLog("  # " + r.desc);
      client.call(r, function (err, res) {
        var cls = "status-" + (Math.floor(res.status / 100) + "xx");
        appendLog("← <span class='status-tag " + cls + "'>" + res.status + "</span>" + res.note);
        appendLog(JSON.stringify(res.body, null, 2));
        appendLog("");
      });
    });
  });

  function appendLog(text) {
    var cur = out.innerHTML;
    if (cur.indexOf("// 等待调用") === 0) cur = "";
    out.innerHTML = cur + text + "\n";
    out.scrollTop = out.scrollHeight;
  }

  window.clearOut = function () {
    out.textContent = "// 已清空。";
  };
})();
</script>
</body>
</html>
