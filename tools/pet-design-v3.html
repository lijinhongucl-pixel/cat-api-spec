<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物形象 v3 — 精修版</title>
<style>
  body { background: #faf9f7; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0; padding: 40px; }
  h1 { font-size: 24px; }
  .sub { color: #6b6b6b; font-size: 13px; margin-bottom: 8px; }
  .note { color: #999; font-size: 12px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 800px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #fff; border: 1px solid #e5e2dd; border-radius: 16px;
    padding: 28px; text-align: center;
  }
  .card .preview { width: 200px; height: 140px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  .card .preview svg { width: 100%; height: 100%; }
  .card h3 { font-size: 17px; margin: 0 0 4px; }
  .card .role { font-size: 12px; color: #999; }
</style>
</head>
<body>
<h1>宠物形象 v3</h1>
<div class="sub">精修版 — 贝塞尔曲线身体、渐变填充、细节刻画</div>
<div class="note">viewBox 统一 0 0 100 70</div>

<div class="grid">

</div>
<h3>🐶 马文的狗</h3>
<div class="role">金毛 · 吐舌 · 红项圈金吊牌</div>
</div>
