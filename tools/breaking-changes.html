<style>
  body { background: var(--bg); }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 28px 80px; }

  .bc-header {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 26px;
    margin-top: 28px;
  }
  .bc-header h2 { margin: 0 0 8px; font-size: 17px; }
  .bc-header p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
  .bc-header .accent { color: var(--accent); font-weight: 600; }

  .filters {
    margin-top: 28px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    letter-spacing: 0.01em;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .filter-btn .count {
    margin-left: 5px;
    opacity: 0.7;
    font-weight: 700;
  }

  .timeline {
    margin-top: 32px;
    position: relative;
    padding-left: 36px;
    border-left: 2px solid var(--line);
  }

  .bc-entry {
    position: relative;
    margin-bottom: 38px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 26px;
    transition: border-color .2s;
    animation: fadeIn .4s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .bc-entry:hover { border-color: var(--accent); }

  .bc-entry::before {
    content: '';
    position: absolute;
    left: -47px;
    top: 26px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--panel);
    border: 3px solid var(--severity-color, var(--line));
  }

  .bc-entry.major    { --severity-color: #cb2431; }
  .bc-entry.minor    { --severity-color: #d69e2e; }
  .bc-entry.feature  { --severity-color: #2ea043; }
  .bc-entry.deprecate{ --severity-color: #6b7280; }

  .bc-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .bc-version {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    padding: 3px 10px;
    background: rgba(0,0,0,0.04);
    border-radius: 5px;
  }
  .bc-date {
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .bc-sev {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .bc-sev.major    { background: #fee2e2; color: #991b1b; }
  .bc-sev.minor    { background: #fef3c7; color: #92400e; }
  .bc-sev.feature  { background: #dcfce7; color: #166534; }
  .bc-sev.deprecate{ background: #f1f5f9; color: #475569; }

  .bc-entry h3 {
    margin: 4px 0 12px;
    font-size: 16.5px;
    line-height: 1.45;
  }

  .bc-change {
    background: rgba(0,0,0,0.025);
    border-left: 3px solid var(--severity-color, var(--line));
    border-radius: 0 6px 6px 0;
    padding: 12px 16px;
    margin: 10px 0;
    font-size: 13px;
    line-height: 1.7;
  }
  .bc-change .label {
    display: inline-block;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-right: 8px;
    color: var(--faint);
  }
  .bc-change .label.break  { color: #cb2431; }
  .bc-change .label.add    { color: #2ea043; }
  .bc-change .label.remove { color: #6b7280; }

  .bc-rationale {
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink);
  }
  .bc-rationale .who {
    font-style: italic;
    color: var(--accent);
    font-weight: 600;
    margin-right: 4px;
  }
  .bc-rationale .who::after { content: '：'; }

  .bc-tags {
    margin-top: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .bc-tag {
    font-size: 10.5px;
    padding: 3px 9px;
    background: rgba(0,0,0,0.04);
    border-radius: 4px;
    color: var(--muted);
    font-family: 'SF Mono', Consolas, monospace;
  }

  .rollback {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--faint);
  }
  .rollback .x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    background: #fee2e2;
    color: #cb2431;
    border-radius: 50%;
    font-weight: 800;
    font-size: 11px;
    flex-shrink: 0;
  }

  .footnote {
    margin-top: 40px;
    background: var(--panel);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }
</style>

  <h1 style="margin:18px 0 6px;">Breaking Changes</h1>
  <p style="color:var(--muted);font-size:14px;margin:0;">

  </p>

  <div class="bc-header">
    <h2>关于本日志的规则</h2>
    <p>
      这份日志记录所有破坏性变更、新特性引入与旧接口弃用。每一条变更都附有
      <span class="accent">当事猫审核意见</span>。
      回滚请求不受理——因为没有 rollback endpoint，所有写入都是最终一致。
      版本号规则：当事猫说了算。
    </p>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">全部 <span class="count" id="cnt-all">0</span></button>
    <button class="filter-btn" data-filter="major">Major <span class="count" id="cnt-major">0</span></button>
    <button class="filter-btn" data-filter="minor">Minor <span class="count" id="cnt-minor">0</span></button>
    <button class="filter-btn" data-filter="feature">Feature <span class="count" id="cnt-feature">0</span></button>
    <button class="filter-btn" data-filter="deprecate">Deprecated <span class="count" id="cnt-deprecate">0</span></button>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="footnote">
    <strong>不是 changelog。</strong>
    这份文档与正式 <a href="../docs/CHANGELOG.md">CHANGELOG</a> 的区别：
    CHANGELOG 由规范编写组撰写，记录代码层面的提交；
    本日志由当事猫撰写，记录它单方面决定的事实变更。
    二者出现冲突时，以本日志为准——因为猫不接受 code review。
  </div>
</div>

  var timeline = document.getElementById('timeline');
  var currentFilter = 'all';

  function render() {
    var list = currentFilter === 'all'
      ? CHANGES
      : CHANGES.filter(function(c) { return c.severity === currentFilter; });

    if (list.length === 0) {
      timeline.innerHTML = '<div style="text-align:center;color:var(--faint);padding:60px;font-style:italic;">// 该筛选条件下没有变更记录</div>';
      return;
    }

    timeline.innerHTML = list.map(function(c) {
      var changesHtml = c.changes.map(function(ch) {
        var label = ch.type === 'break' ? 'Breaking' : ch.type === 'add' ? 'Added' : 'Removed';
        return '<div class="bc-change">' +
          '<span class="label ' + ch.type + '">' + label + '</span>' + ch.text +
        '</div>';
      }).join('');

      var tagsHtml = c.tags.map(function(t) {
        return '<span class="bc-tag">#' + t + '</span>';
      }).join('');

      return '<article class="bc-entry ' + c.severity + '">' +
        '<div class="bc-meta">' +
          '<span class="bc-version">' + c.version + '</span>' +
          '<span class="bc-date">' + c.date + '</span>' +
          '<span class="bc-sev ' + c.severity + '">' + c.severity + '</span>' +
        '</div>' +
        '<h3>' + c.title + '</h3>' +
        changesHtml +
        '<div class="bc-rationale">' +
          '<span class="who">' + c.who + '</span>' + c.rationale +
        '</div>' +
        '<div class="bc-tags">' + tagsHtml + '</div>' +
        '<div class="rollback">' +
          '<span class="x">×</span> 回滚请求状态：' + (c.rollback ? '已批准' : '不受理') +
        '</div>' +
      '</article>';
    }).join('');
  }

  function updateCounts() {
    document.getElementById('cnt-all').textContent = CHANGES.length;
    ['major', 'minor', 'feature', 'deprecate'].forEach(function(s) {
      document.getElementById('cnt-' + s).textContent = CHANGES.filter(function(c) {
        return c.severity === s;
      }).length;
    });
  }

  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  updateCounts();
  render();

})();
</script>
